<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GFX Revision — Past Exams</title>
  <meta name="description" content="Attempt past computer graphics papers." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Navbar -->
  <nav id="navbar"></nav>

  <!-- Main content -->
  <main id="main-content" class="container py-5">
    <div class="mb-5 fade-in">
      <h1 class="display-5 fw-bold mb-2">Past <span class="card-title-accent">Final Exams</span></h1>
      <p class="text-muted">Simulate the real exam hall experience. Practice with actual previous final exam questions, track your performance, and add incorrect questions directly to your review stack.</p>
    </div>

    <!-- Exams Grid -->
    <div class="row g-4 fade-in" style="animation-delay: 0.1s;" id="exams-grid">
      <!-- Exam cards dynamically injected -->
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-info" role="status">
          <span class="visually-hidden">Loading exams...</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/exams.js"></script>
</body>
</html>
