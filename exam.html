<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GFX Revision — Exam Solver</title>
  <meta name="description" content="Solve past Computer Graphics exam papers." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Navbar -->
  <nav id="navbar"></nav>

  <!-- Main content -->
  <main id="main-content" class="container py-5">
    
    <!-- Header Controls -->
    <div class="d-flex justify-content-between align-items-center mb-4 fade-in">
      <a href="exams.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Exit Exam</a>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-danger px-3 py-2 fs-6 d-flex align-items-center gap-2" id="timer-badge">
          <i class="bi bi-alarm-fill"></i> <span id="timer-display">00:00</span>
        </span>
      </div>
    </div>

    <!-- Solver Layout -->
    <div class="row g-4 fade-in" style="animation-delay: 0.1s;">
      
      <!-- Left side: Questions Panel -->
      <div class="col-lg-8" id="question-panel-col">
        <div class="panel-glass p-4 mb-4">
          <!-- Question Progress Bar -->
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="small text-muted" id="q-counter">Question 0 of 0</span>
            <span class="small text-info fw-bold" id="q-percent">0% Completed</span>
          </div>
          <div class="progress mb-4" style="height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px;">
            <div class="progress-bar" id="exam-progress-bar" role="progressbar" style="width: 0%; background: var(--grad-primary); border-radius: 3px;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
          </div>

          <!-- Question Body -->
          <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
            <h4 class="h5" id="question-text" style="line-height: 1.5;">Loading question...</h4>
            <button class="btn btn-sm text-warning flag-btn p-0" id="flag-btn-exam">
              <i class="bi bi-flag"></i>
            </button>
          </div>

          <!-- Options Grid -->
          <div id="options-container" class="mb-4">
            <!-- Injected by JS -->
          </div>

          <!-- Explanation Panel -->
          <div class="answer-panel d-none mb-4" id="explanation-panel">
            <h6 class="text-info mb-1"><i class="bi bi-info-circle"></i> Explanation:</h6>
            <p class="text-muted small mb-0" id="explanation-text"></p>
          </div>

          <!-- Action Buttons -->
          <div class="d-flex justify-content-between mt-4">
            <button class="btn btn-outline-secondary px-4" id="prev-btn" disabled>
              <i class="bi bi-chevron-left"></i> Previous
            </button>
            <button class="btn btn-primary px-4" id="next-btn" style="background: var(--grad-primary); border: none; color: #ffffff; font-weight: 600;">
              Next <i class="bi bi-chevron-right"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Right side: Questions Sidebar/Grid for quick navigation -->
      <div class="col-lg-4" id="nav-panel-col">
        <div class="panel-glass p-4">
          <h5 class="h6 mb-3" style="font-family: var(--font-title);">Question Navigation</h5>
          <div class="d-flex flex-wrap gap-2 mb-4" id="navigator-grid">
            <!-- Buttons injected by JS -->
          </div>
          <hr style="border-color: rgba(255,255,255,0.06);">
          <button class="btn btn-danger w-100 py-2.5 fw-bold" id="submit-exam-btn" style="box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2);">
            Submit Exam
          </button>
        </div>
      </div>

    </div>

    <!-- Results Panel (Hidden initially) -->
    <div id="results-panel" class="d-none fade-in">
      <div class="row justify-content-center">
        <div class="col-md-8 text-center">
          <div class="panel-glass p-5 mb-5 shadow-lg">
            <div class="fs-1 text-success mb-3"><i class="bi bi-trophy-fill"></i></div>
            <h2 class="display-5 fw-bold mb-2">Exam Completed!</h2>
            <p class="text-muted mb-4" id="results-meta">You attempted the 2024 Exam.</p>
            
            <div class="display-3 fw-bold mb-2 text-info" id="results-score">0 / 0</div>
            <h4 class="text-success mb-4" id="results-percentage">0%</h4>

            <div class="progress mb-4" style="height: 12px; background: rgba(255,255,255,0.05); border-radius: 6px;">
              <div class="progress-bar bg-success" id="results-progress" role="progressbar" style="width: 0%; border-radius: 6px;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            </div>

            <p class="text-muted small mb-4" id="results-summary">
              All incorrect answers have been logged into your Mistakes tab for study review.
            </p>

            <div class="d-flex gap-3 justify-content-center">
              <a href="exams.html" class="btn btn-outline-secondary px-4 py-2">Back to Exams</a>
              <a href="mistakes.html" class="btn btn-primary px-4 py-2" style="background: var(--grad-primary); border: none; color: #ffffff; font-weight: 600;">Review Mistakes</a>
            </div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/exam.js"></script>
</body>
</html>
