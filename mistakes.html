<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GFX Revision — Mistakes Review</title>
  <meta name="description" content="Review and solve your logged mistakes." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Navbar -->
  <nav id="navbar"></nav>

  <!-- Main content -->
  <main id="main-content" class="container py-5">
    
    <div class="d-flex flex-md-row flex-column justify-content-between align-items-md-center mb-5 gap-3 fade-in">
      <div>
        <h1 class="display-5 fw-bold mb-2">Mistakes <span class="card-title-accent">Review</span></h1>
        <p class="text-muted mb-0">Re-practice questions you previously got incorrect. Answer them correctly here to clear them from this list.</p>
      </div>
      <div>
        <button id="clear-all-mistakes-btn" class="btn btn-outline-danger" style="font-family: var(--font-title); font-weight: 500;">
          <i class="bi bi-trash"></i> Clear All Mistakes
        </button>
      </div>
    </div>

    <!-- Active Mistakes List -->
    <div id="mistakes-container" class="row g-4 fade-in" style="animation-delay: 0.1s;">
      <!-- Injected by mistakes.js -->
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-info" role="status">
          <span class="visually-hidden">Loading mistakes...</span>
        </div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mistakes.js"></script>
</body>
</html>
