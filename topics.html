<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GFX Revision — Topics</title>
  <meta name="description" content="Explore Computer Graphics Syllabus Topics" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Navbar -->
  <nav id="navbar"></nav>

  <!-- Main content -->
  <main id="main-content" class="container py-5">
    <div class="d-flex flex-md-row flex-column justify-content-between align-items-md-center mb-5 gap-3 fade-in">
      <div>
        <h1 class="display-5 fw-bold mb-2">Syllabus <span class="card-title-accent">Revision Topics</span></h1>
        <p class="text-muted mb-0">Select a topic to study must-know concepts, equations, cheat sheet summaries, and attempt practice questions.</p>
      </div>
      <div class="panel-glass px-4 py-3 text-center" style="min-width: 200px;">
        <h6 class="text-muted small mb-1">Overall Revision Progress</h6>
        <div class="progress mt-2" style="height: 10px; background: rgba(255,255,255,0.05); border-radius: 5px;">
          <div id="overall-progress-bar" class="progress-bar" role="progressbar" style="width: 0%; background: var(--grad-primary); border-radius: 5px;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <span id="overall-progress-text" class="small text-info fw-bold mt-1 d-inline-block">0% Mastered</span>
      </div>
    </div>

    <!-- Topics Grid -->
    <div id="topics-grid" class="row g-4 fade-in animate__animated animate__fadeIn" style="animation-delay: 0.1s;">
      <!-- Dynamic Cards Injected by topics.js -->
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-info" role="status">
          <span class="visually-hidden">Loading topics...</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/topics.js"></script>
</body>
</html>
